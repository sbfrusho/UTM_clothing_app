name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (analyze, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      # Unit, widget and purchase-flow tests (fakes, no device needed).
      # The golden screenshots in tool/ render fonts differently on Linux,
      # so they are run locally, not here.
      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Prepare google-services.json (CI only)
        run: python3 tool/ci/patch_google_services.py

      # Signed with the debug key unless key.properties exists, so this
      # proves the release build compiles; it is not the Play upload.
      - name: Build app bundle
        run: flutter build appbundle --release --dart-define-from-file=env/example.json

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  functions:
    name: Cloud Functions (build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  rules:
    name: Security rules (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test/firestore_rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/firestore_rules/package-lock.json
      - run: npm ci
      - name: Run rules tests
        run: >-
          npx firebase emulators:exec --only firestore
          --project demo-your-shop --config ../../firebase.json
          "node --test rules.test.mjs"
